<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Unblock It</title>
  <meta name="description" content="Slide the blocks out through the doors of their colour.">
  <meta name="theme-color" content="#1a1538">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Unblock It">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <main id="home" class="screen">
    <div class="logo" aria-hidden="true">
    </div>
    <h1>Unblock&nbsp;It</h1>
    <p class="tag">Slide every block out through the door of its colour.</p>
    <button class="big" id="play">Play</button>
    <button class="ghost" id="to-levels">Levels</button>
    <button class="ghost" id="to-board">🏆 Leaderboard</button>
    <button class="me-chip" id="me-chip" hidden></button>
    <p class="stars-total" id="stars-total"></p>
    <button class="ghost small" id="sound">🔊 Sound on</button>
  </main>

  <main id="levels" class="screen" hidden>
    <header class="bar">
      <button class="icon" id="levels-back" aria-label="Back">‹</button>
      <h2>Levels</h2>
      <span class="spacer"></span>
    </header>
    <div id="level-grid"></div>
  </main>

  <main id="ranks" class="screen" hidden>
    <header class="bar">
      <button class="icon" id="ranks-back" aria-label="Back">‹</button>
      <h2>Leaderboard</h2>
      <span class="spacer"></span>
    </header>
    <div id="rank-me"></div>
    <ol id="rank-list"></ol>
  </main>

  <main id="game" class="screen" hidden>
    <header class="bar">
      <button class="icon" id="game-back" aria-label="Levels">‹</button>
      <div class="title"><h2 id="level-name">Level 1</h2><span id="moves">0 moves · par 5</span></div>
      <button class="icon" id="undo" aria-label="Undo">↶</button>
      <button class="icon" id="restart" aria-label="Restart">↻</button>
    </header>
    <p id="hint"></p>
    <div id="board-wrap"><div id="board"></div></div>
  </main>

  <div id="name-modal" class="overlay" hidden>
    <form class="card" id="name-form" autocomplete="off">
      <h2>Your nickname</h2>
      <p>It’s how you’ll show up on the leaderboard.</p>
      <input id="name-input" maxlength="16" placeholder="e.g. BlockBoss" autocapitalize="off" spellcheck="false">
      <p class="err" id="name-err"></p>
      <button class="big" id="name-save" type="submit">Save</button>
      <button class="ghost" id="name-cancel" type="button">Not now</button>
    </form>
  </div>

  <div id="win" class="overlay" hidden>
    <div class="card">
      <h2>Unblocked!</h2>
      <div class="win-stars" id="win-stars"></div>
      <p id="win-text"></p>
      <div id="win-best"></div>
      <button class="big" id="next">Next level</button>
      <button class="ghost" id="replay">Play again</button>
    </div>
  </div>

  <script src="js/engine.js?v=5"></script>
  <script src="js/levels.js?v=5"></script>
  <script src="js/audio.js?v=5"></script>
  <script src="js/art.js?v=5"></script>
  <script src="js/game.js?v=5"></script>
  <script type="module" src="js/online.js?v=5"></script>
</body>
</html>
