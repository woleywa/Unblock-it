# Builds the iOS and Android apps from the web game on every push to main (and on demand).
# Android: a debug APK you can install on a phone (download it from the run's Artifacts).
# iOS: a simulator build that proves the app compiles, plus an unsigned .ipa you can sign with your
# own (free) Apple ID and install with Sideloadly or AltStore. App Store/TestFlight uploads need the
# Apple Developer account's signing keys as repository secrets (see APPS.md).
name: Apps
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The website on Firebase Hosting (https://happyblocks-game.web.app). Needs the repository secret
  # FIREBASE_SERVICE_ACCOUNT (the service-account JSON); without it this job just says so and skips.
  hosting:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Deploy to Firebase Hosting
        if: env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 deploy --only hosting --project unblock-it-913f7 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: No Firebase key yet
        if: env.SA == ''
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT repository secret to publish the website to Firebase Hosting."

  # Live updates: the game files as a zip + update.json on the "app-web" release. The apps check it at
  # start-up, download a newer game in the background and use it from the next launch.
  web-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Publish the game for live updates
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          (cd www && zip -qr "../bundle-$N.zip" .)
          URL="https://github.com/${{ github.repository }}/releases/download/app-web/bundle-$N.zip"
          node -e "const v=require('./www/version.json'); console.log(JSON.stringify({ ...v, url: process.argv[1] }))" "$URL" > update.json
          cat update.json
          gh release view app-web >/dev/null 2>&1 || gh release create app-web --prerelease \
            --title "App live updates" --notes "Game files the iOS/Android apps download as live updates. Managed by the Apps workflow — don't edit."
          gh release upload app-web "bundle-$N.zip" --clobber
          gh release upload app-web update.json --clobber
          # Keep the newest 3 bundles.
          gh release view app-web --json assets -q '.assets[].name' | grep '^bundle-' | sort -t- -k2 -n | head -n -3 \
            | xargs -r -I{} gh release delete-asset app-web {} -y

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:web && npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: happy-blocks-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web && npx cap sync ios
      - name: Build for the simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
      - name: Unsigned .ipa (sign it with your own Apple ID to install; see APPS.md)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -20
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr HappyBlocks-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: happy-blocks-ios-unsigned
          path: HappyBlocks-unsigned.ipa
